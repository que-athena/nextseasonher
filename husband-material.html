<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#560000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Husband Material">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="husband-material.webmanifest">
<link rel="apple-touch-icon" href="hm-icon-180.png">
<link rel="icon" href="hm-icon-192.png">
<title>Husband Material | NextSeasonHer™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700;1,800&family=Mr+Dafoe&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FAF5EE; --blush:#F4DDD3; --blush-light:#F8E6DE; --card:#FFFDFA; --ink:#1E1412; --body:#3A2A26; --soft:#5E4B45;
  --line:rgba(30,20,18,.12); --edge:#E6D6CC; --burgundy:#560000; --lip:#7A0F1C; --lip-nude:#E59A8E; --on-dark:#EBD3CB;
  --grad:radial-gradient(120% 90% at 78% 8%, rgba(140,40,34,.42), transparent 62%), linear-gradient(176deg,#4A0404 0%,#2E0505 58%,#190404 100%);
  --glow:radial-gradient(120% 90% at 78% 8%, rgba(140,40,34,.22), transparent 62%), linear-gradient(176deg,#F8E6DE 0%,#F1D3C7 60%,#E8BFB0 100%);
  --display:'Playfair Display',Georgia,serif;
  --script:'Mr Dafoe','Brush Script MT',cursive;
  --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --nav:68px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ivory);color:var(--body);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 80px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap a:not(.btn):not(.tile):not(.man){color:var(--burgundy);text-underline-offset:3px}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--burgundy);margin:0 0 12px}
.lip{font-family:var(--script);font-weight:400;color:var(--lip);display:inline-block;line-height:1;font-size:1.5em;vertical-align:baseline;margin:0 .08em 0 .12em;transform:rotate(-11deg) translateY(-.06em);transform-origin:left bottom;filter:url(#lipstick)}
.on-dark .lip{color:var(--lip-nude)}
h1,h2,.display{font-family:var(--display);font-weight:800;color:var(--ink);letter-spacing:-.005em}
h2{font-size:clamp(32px,8.6vw,42px);line-height:1.1;margin:0 0 14px}
h3{font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);margin:0 0 8px;line-height:1.3}
p{margin:0 0 14px}
.soft{color:var(--soft)}
.small{font-size:14px}
.screen{padding-top:22px;padding-bottom:36px}
svg.ic{width:22px;height:22px;flex:none}

/* top bar */
.topbar{position:sticky;top:0;z-index:15;background:rgba(250,245,238,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .in{display:flex;align-items:center;gap:8px;height:52px;max-width:640px;margin:0 auto;padding:0 10px}
.backbtn{background:transparent;border:0;color:var(--burgundy);padding:8px 10px;min-height:44px;font-size:16px;gap:4px}
.backbtn svg{width:20px;height:20px}
.topbar .t{flex:1;text-align:center;font-weight:600;color:var(--ink);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:62px}

/* screen head */
.shead{background:linear-gradient(180deg,var(--tint) 0%,var(--ivory) 100%);padding:40px 0 30px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;flex:none}
.badge svg{width:22px;height:22px}
.badge.sm{width:36px;height:36px;border-radius:11px}
.badge.sm svg{width:18px;height:18px}

/* photos */
.photo{position:relative;border-radius:20px;overflow:hidden;margin:0 0 22px;display:flex;align-items:flex-end;justify-content:flex-start}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.04)}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.photo .ph svg{width:40px;height:40px;opacity:.55}
.photo .cap{position:relative;margin:12px;background:rgba(30,20,18,.62);color:#F8E6DE;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;max-width:calc(100% - 24px)}

/* hero */
.hero{background:var(--grad);color:var(--on-dark);padding:calc(68px + env(safe-area-inset-top,0px)) 0 60px;text-align:center;position:relative;overflow:hidden;background-size:cover;background-position:center}
.hero .eyebrow{color:var(--blush);margin-bottom:20px}
.hero h1{font-size:clamp(44px,12vw,68px);line-height:1.04;color:var(--blush-light);margin:0 0 18px;position:relative}
.hero h1 .lip{display:block;margin:0 auto;transform:rotate(-11deg);transform-origin:center;width:max-content;font-size:1.25em}
.hero p{font-size:17px;font-weight:500;margin:0 auto;max-width:30ch;position:relative}
.hero .deco{position:absolute;opacity:.16;color:var(--lip-nude)}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--edge);border-radius:20px;padding:24px 22px;margin:0 0 20px}
.card.glow{background:var(--glow);border-color:transparent}
.card.tint{border-color:transparent}
.card.dark{background:var(--grad);border:0;color:var(--on-dark)}
.card.dark h3,.card.dark .display{color:var(--blush-light)}
.card.dark .eyebrow{color:var(--blush)}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
label,.label{display:block;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--soft);margin:20px 0 8px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;font-family:var(--sans);font-size:17px;line-height:1.45;color:var(--ink);background:#fff;border:1px solid var(--edge);border-radius:10px;padding:11px 13px}
textarea{resize:none;overflow:hidden;min-height:60px}
textarea:focus,input:focus,select:focus{outline:2px solid rgba(86,0,0,.3);outline-offset:1px;border-color:var(--burgundy)}
button,.btn{font-family:var(--sans);font-size:15px;font-weight:600;border-radius:999px;padding:11px 18px;cursor:pointer;border:1px solid var(--burgundy);background:var(--burgundy);color:var(--blush-light);min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.ghost,.btn.ghost{background:transparent;color:var(--burgundy)}
.card.dark button.ghost,.card.dark .btn.ghost{color:var(--blush);border-color:var(--blush)}
.card.dark button:not(.ghost),.card.dark .btn:not(.ghost){background:var(--blush);border-color:var(--blush);color:#2E0505}
button.wide,.btn.wide{width:100%}
button:focus-visible,a:focus-visible{outline:2px solid var(--burgundy);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--edge);background:#fff;color:var(--ink);font-weight:500;padding:9px 14px;min-height:40px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--c-ink,var(--burgundy));border-color:var(--c-ink,var(--burgundy));color:#fff}
.chip.star::after{content:" ★";color:var(--lip)}
.chip.star[aria-pressed="true"]::after{color:var(--lip-nude)}
.chip.locked{background:var(--burgundy);border-color:var(--burgundy);color:var(--blush-light)}
.seg{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.seg button{border:1px solid var(--edge);background:#fff;color:var(--ink);font-weight:500;flex:1 1 auto}
.seg button[aria-pressed="true"]{background:var(--burgundy);border-color:var(--burgundy);color:var(--blush-light)}
.q{padding:20px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.progress{height:8px;border-radius:999px;background:var(--blush);overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--lip-nude),var(--burgundy));transition:width .3s}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;border-radius:999px;padding:4px 10px;background:var(--blush);color:var(--burgundy)}
.pill.over{background:var(--lip);color:var(--blush-light)}
.note{background:var(--blush-light);border-radius:14px;padding:16px 18px;font-size:15px;color:var(--soft);margin:16px 0}
.say{font-size:18px;line-height:1.5;color:var(--ink);margin:8px 0 14px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--blush-light);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
[hidden]{display:none!important}
.private .nm{filter:blur(6px)}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(250,245,238,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom ul{display:flex;max-width:640px;margin:0 auto;padding:0;list-style:none}
nav.bottom li{flex:1}
nav.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav);color:var(--soft);text-decoration:none;font-size:12px;font-weight:600}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a[aria-current="page"]{color:var(--burgundy)}
nav.bottom a[aria-current="page"] svg{fill:var(--blush)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom,0px));z-index:21;box-shadow:0 8px 24px rgba(86,0,0,.28);padding:12px 18px}

/* home */
.paths{display:grid;gap:12px}
.path{display:flex;gap:14px;align-items:center;justify-content:flex-start;text-align:left;width:100%;background:#fff;border:1px solid var(--edge);border-radius:16px;padding:16px;color:var(--ink);font-weight:500;min-height:68px}
.path[aria-pressed="true"]{border-color:var(--burgundy);box-shadow:inset 0 0 0 1px var(--burgundy)}
.path strong{display:block;font-size:17px}
.path span.d{font-size:14px;color:var(--soft);font-weight:400}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.tick.on{background:var(--burgundy);border-color:var(--burgundy);color:var(--blush-light)}
.steps a{color:var(--ink)!important;font-weight:600;text-decoration:none;flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:14px;background:#fff;border:1px solid var(--edge);border-radius:18px;padding:18px;color:var(--ink);text-decoration:none;font-weight:600;min-height:136px}
.tile span.d{display:block;font-weight:400;font-size:13px;color:var(--soft);margin-top:2px}
.stat{border-radius:18px;padding:18px 12px;text-align:center}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1}
.stat span{font-size:12px;font-weight:600;letter-spacing:.04em}
.que{display:flex;gap:14px;align-items:center}
.que img{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--blush)}
.glance{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.glance:first-of-type{border-top:0}

/* profile */
.stepper{display:flex;gap:6px;margin:0 0 28px}
.stepper a{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--soft)!important;text-decoration:none;padding-top:8px;border-top:4px solid var(--edge)}
.stepper a.done{border-color:var(--lip-nude);color:var(--ink)!important}
.stepper a.cur{border-color:var(--burgundy);color:var(--burgundy)!important}
.tiers{display:grid;gap:6px;justify-items:center;margin:6px 0 4px}
.tiers div{border-radius:14px;padding:12px 14px;text-align:center;font-weight:600;font-size:15px}
.tiers small{display:block;font-weight:400;font-size:13px}
.slots{display:flex;gap:8px;margin:12px 0}
.slots span{flex:1;height:46px;border-radius:12px;border:2px dashed rgba(244,221,211,.45);display:flex;align-items:center;justify-content:center}
.slots span.on{background:var(--blush);border:0;color:var(--burgundy)}
.check{border:2px solid var(--burgundy);border-radius:20px;padding:22px 20px;margin:20px 0;background:#fff}
.hcard{background:var(--grad);color:var(--on-dark);border-radius:24px;padding:38px 24px;text-align:center}
.hcard .eyebrow{color:var(--blush)}
.hcard .t{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05;color:var(--blush-light);margin:0 0 6px}
.hcard .t .lip{display:block;margin:0 auto;width:max-content;transform:rotate(-11deg);transform-origin:center;font-size:1.2em}
.hcard ol{text-align:left;margin:18px auto 14px;padding:0;list-style:none;max-width:320px;counter-reset:n}
.hcard li{counter-increment:n;padding:10px 0;border-top:1px solid rgba(244,221,211,.2);color:var(--blush-light);font-weight:600}
.hcard li::before{content:counter(n);display:inline-block;width:26px;color:var(--lip-nude);font-family:var(--display)}
.hcard li small{display:block;font-weight:400;color:var(--on-dark);padding-left:26px;font-size:14px}
.hcard .base{font-size:13px;color:var(--on-dark);margin:0 0 8px}
.hcard li .me{display:block;padding-left:26px;margin-top:6px;font-size:14px;font-weight:500;color:var(--lip-nude)}
.hcard li .me b{font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:11px;margin-right:6px}
.who{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:#EADCD2;color:#5C3A2B;font-size:12px;font-weight:600;flex:none}
.who.me{background:#B23A2E;color:#fff}
.hcard .foot{font-size:12px;color:var(--blush);letter-spacing:.06em;margin:6px 0 0}

/* roster & charts */
.man{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit}
.man .name{font-family:var(--display);font-weight:800;font-size:24px;color:var(--ink);line-height:1.1}
.meter{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--soft)}
.meter .progress{flex:1}
svg.radar{width:100%;height:auto}
svg.radar text{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--soft)}
.log{padding:16px 0;border-top:1px solid var(--line);font-size:15px}
.log:first-child{border-top:0}
.track{display:flex;gap:4px;margin:12px 0 6px;position:relative}
.track div{height:14px;border-radius:6px;background:var(--blush)}
.track div.past{background:var(--lip-nude)}
.tlabels{display:flex;gap:4px;font-size:11.5px;color:var(--soft);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.split{margin:0 0 20px}
.sbar{height:14px;border-radius:999px;background:#F3D9C9;overflow:hidden;margin-top:6px}
.sbar i{display:block;height:100%;background:var(--burgundy);border-radius:999px}
.hbar{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;font-size:14px;margin:0 0 14px}
.hbar .b{height:12px;border-radius:999px;background:var(--blush);overflow:hidden}
.hbar .b i{display:block;height:100%;border-radius:999px}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px}

/* scripts & scenarios */
.script{padding:20px 0;border-top:1px solid var(--line)}
.script:first-child{border-top:0}
details.sc{border-top:1px solid var(--line)}
details.sc:first-of-type{border-top:0}
details.sc summary{cursor:pointer;list-style:none;padding:18px 0;font-weight:600;color:var(--ink);min-height:48px;display:flex;justify-content:space-between;gap:10px}
details.sc summary::-webkit-details-marker{display:none}
details.sc summary::after{content:"+";color:var(--burgundy);font-size:20px;line-height:1}
details.sc[open] summary::after{content:"–"}
details.sc .body{padding:0 0 16px}
.do{display:grid;grid-template-columns:28px 1fr;gap:12px;margin:0 0 16px;align-items:start}
.do .badge{width:28px;height:28px;border-radius:9px}
.do .badge svg{width:16px;height:16px}

/* pause */
.pause{position:fixed;inset:0;z-index:50;background:var(--grad);color:var(--on-dark);overflow-y:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 0 40px}
.pause h2{color:var(--blush-light)}
.pause .timerwrap{position:relative;width:220px;height:220px;margin:14px auto 6px}
.pause .timer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:56px;color:var(--blush-light);margin:0}
.pause .stdlist{list-style:none;padding:0;margin:0}
.pause .stdlist li{padding:10px 0;border-top:1px solid rgba(244,221,211,.2);color:var(--blush-light);font-weight:600}
.pause .stdlist li small{display:block;font-weight:400;color:var(--on-dark)}
.pause textarea{background:var(--blush-light)}
.pause .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:44px;height:44px;padding:0;background:transparent;border:1px solid rgba(244,221,211,.4);color:var(--blush-light);font-size:20px}

.voice{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--edge);border-radius:16px;padding:12px 14px;margin:0 0 22px}
.voice .vb{width:44px;height:44px;border-radius:50%;flex:none;background:var(--burgundy);color:var(--blush-light);display:flex;align-items:center;justify-content:center}
.voice .vb svg{width:20px;height:20px}
.voice audio{width:100%;height:36px;margin:0}
.voice.draft{border-style:dashed;border-color:var(--lip-nude)}
.pause .voice{background:rgba(255,255,255,.08);border-color:rgba(244,221,211,.25)}
.pause .voice p{color:var(--blush-light)!important}
.celebrate{text-align:center}
.celebrate .display{font-size:34px;line-height:1.1}
.verdict{text-align:center}
.verdict .vi{width:64px;height:64px;border-radius:50%;background:rgba(244,221,211,.14);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:var(--lip-nude)}
.verdict .vi svg{width:32px;height:32px}
.balance{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end;margin:14px 0 4px;height:120px}
.balance div{border-radius:12px 12px 4px 4px;display:flex;align-items:flex-end;justify-content:center;font-weight:600;font-size:13px;padding-bottom:8px}
@media (min-width:560px){.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
@media print{nav.bottom,.fab,.pause,.topbar{display:none!important}body{padding:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute"><defs><filter id="lipstick" x="-10%" y="-30%" width="120%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"></feDisplacementMap></filter></defs></svg>

<header class="topbar" id="topbar" hidden><div class="in"><button type="button" class="backbtn" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button><span class="t" id="tbTitle"></span></div></header>

<div id="view"></div>

<button type="button" class="fab" id="fab" aria-label="I want to text him">💄 I want to text him</button>

<nav class="bottom" aria-label="Main">
